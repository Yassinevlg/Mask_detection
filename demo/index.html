<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mask Detection · Démo Temps Réel</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--accent:#6c63ff;--green:#22c55e;--red:#ef4444;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;gap:1.5rem}
h1{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#6c63ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
p.sub{color:var(--muted);font-size:.9rem;text-align:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;width:100%;max-width:640px;display:flex;flex-direction:column;gap:1.2rem}
.vid-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
#video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{position:absolute;width:100%;height:100%}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:.5rem;font-size:.9rem}
.result{display:flex;align-items:center;gap:1rem}
#labelEl{font-size:1.3rem;font-weight:700;min-width:170px;transition:color .3s}
.mask{color:var(--green)}.no-mask{color:var(--red)}.idle{color:var(--muted)}
.track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;width:0%;transition:width .2s,background .3s}
#confEl{font-size:.85rem;color:var(--muted);min-width:42px;text-align:right}
.btns{display:flex;gap:.75rem}
button{flex:1;padding:.75rem;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
#btnStart, #btnImage{background:var(--accent);color:#fff}
#btnStop{background:var(--border);color:var(--text)}
.status{font-size:.8rem;color:var(--muted);text-align:center}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:var(--muted)}
.dot.on{background:var(--green);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.note{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}
code{background:var(--border);padding:.1rem .4rem;border-radius:4px;font-size:.75rem}
</style>
</head>
<body>

<h1>🎭 Mask Detection</h1>
<p class="sub">Détection du port du masque en temps réel — TensorFlow.js</p>

<div class="card">
  <div class="vid-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="placeholder" id="ph">📷 Caméra inactive</div>
  </div>

  <div class="result">
    <div id="labelEl" class="idle">— — —</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div id="confEl">—</div>
  </div>

  <div class="btns">
    <button id="btnStart" disabled>▶ Caméra</button>
    <button id="btnImage" disabled>🖼 Image</button>
    <button id="btnStop" disabled>⏹ Arrêter</button>
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
  </div>

  <p class="status"><span class="dot" id="dot"></span><span id="statusEl">Chargement du modèle…</span></p>
</div>

<p class="note">
  Servez depuis la racine du plugin :<br>
  <code>cd plugins/mask-detection-cnn &amp;&amp; python -m http.server 8080</code><br>
  puis ouvrez <strong>http://localhost:8080/demo/</strong>
</p>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const MODEL_URL  = '../models/tfjs_model/model.json';
const IMG_SIZE   = 128;
// LabelEncoder tri alphabétique : with_mask=0, without_mask=1
const LABELS     = ['with_mask', 'without_mask'];
const INTERVAL   = 120; // ms entre prédictions

// ── DOM ──────────────────────────────────────────────────────────────────────
const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const ph       = document.getElementById('ph');
const labelEl  = document.getElementById('labelEl');
const fill     = document.getElementById('fill');
const confEl   = document.getElementById('confEl');
const btnStart = document.getElementById('btnStart');
const btnImage = document.getElementById('btnImage');
const btnStop  = document.getElementById('btnStop');
const imageInput = document.getElementById('imageInput');
const dot      = document.getElementById('dot');
const statusEl = document.getElementById('statusEl');

// ── State ────────────────────────────────────────────────────────────────────
let model = null, stream = null, isRunning = false, rafId = null, lastTs = 0;

// ── Helpers ──────────────────────────────────────────────────────────────────
function setStatus(msg, active = false) {
  statusEl.textContent = msg;
  dot.className = 'dot' + (active ? ' on' : '');
}

function updateResult(probs) {
  // Le modèle actuel est corrompu et retourne toujours les mêmes probabilités, on remet l'ordre d'origine
  const isMask = probs[0] >= probs[1];
  const conf   = isMask ? probs[0] : probs[1];
  const color  = isMask ? '#22c55e' : '#ef4444';
  const label  = isMask ? '✅ Masque porté' : '❌ Sans masque';

  labelEl.textContent = label;
  labelEl.className   = isMask ? 'mask' : 'no-mask';
  fill.style.width      = (conf * 100).toFixed(1) + '%';
  fill.style.background = color;
  confEl.textContent    = (conf * 100).toFixed(0) + '%';

  // Overlay coloré sur le canvas
  ctx.fillStyle = color + '22';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Bordure
  ctx.strokeStyle = color;
  ctx.lineWidth   = 4;
  ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

  // Texte
  ctx.fillStyle = color;
  ctx.font      = 'bold 18px system-ui';
  ctx.fillText(label + ' — ' + (conf * 100).toFixed(0) + '%', 20, 36);
}

// ── Modèle ───────────────────────────────────────────────────────────────────
async function loadModel() {
  try {
    model = await tf.loadLayersModel('/models/tfjs_model/model.json');
    // Warm-up
    const t = tf.zeros([1, IMG_SIZE, IMG_SIZE, 3]);
    model.predict(t).dispose(); t.dispose();
    setStatus('Modèle prêt — choisissez une option');
    btnStart.disabled = false;
    btnImage.disabled = false;
  } catch (e) {
    setStatus('⚠ Modèle TF.js introuvable — convertissez le modèle d\'abord');
    console.error(e);
  }
}

// ── Prédiction ────────────────────────────────────────────────────────────────
function predict() {
  return tf.tidy(() => {
    const t = tf.browser.fromPixels(canvas)
      .resizeBilinear([IMG_SIZE, IMG_SIZE])
      .toFloat().div(255).expandDims(0);
    return Array.from(model.predict(t).dataSync());
  });
}

// ── Boucle ───────────────────────────────────────────────────────────────────
function loop(ts) {
  if (!isRunning) return;
  const W = canvas.width, H = canvas.height;
  ctx.drawImage(video, 0, 0, W, H);

  if (ts - lastTs > INTERVAL) {
    lastTs = ts;
    const probs = predict();
    updateResult(probs);
  }
  rafId = requestAnimationFrame(loop);
}

// ── Contrôles ────────────────────────────────────────────────────────────────
btnStart.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();

    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;

    ph.style.display = 'none';
    video.style.display = 'block';
    canvas.style.transform = 'scaleX(-1)';
    isRunning = true;

    btnStart.disabled = true;
    btnImage.disabled = true;
    btnStop.disabled  = false;
    setStatus('Détection en cours…', true);
    rafId = requestAnimationFrame(loop);
  } catch (e) {
    setStatus('⚠ Accès caméra refusé');
    console.error(e);
  }
});

btnStop.addEventListener('click', () => {
  isRunning = false;
  cancelAnimationFrame(rafId);
  stream?.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  video.style.display = 'none';
  ph.style.display = 'flex';
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  labelEl.textContent = '— — —';
  labelEl.className   = 'idle';
  fill.style.width    = '0%';
  confEl.textContent  = '—';

  btnStart.disabled = false;
  btnImage.disabled = false;
  btnStop.disabled  = true;
  imageInput.value  = '';
  setStatus('Arrêté — modèle prêt');
});

// ── Contrôle Image ───────────────────────────────────────────────────────────
btnImage.addEventListener('click', () => {
  imageInput.click();
});

imageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      if (isRunning) btnStop.click();
      
      video.style.display = 'none';
      ph.style.display = 'none';
      canvas.style.transform = 'scaleX(1)';
      
      const ratio = img.width / img.height;
      canvas.width = Math.min(img.width, 640);
      canvas.height = canvas.width / ratio;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      const probs = predict();
      updateResult(probs);
      
      btnStart.disabled = false;
      btnImage.disabled = false;
      btnStop.disabled = false;
      setStatus('Image analysée', false);
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadModel();
</script>
</body>
</html>
